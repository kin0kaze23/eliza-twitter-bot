name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  risk-policy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.policy.outputs.tier }}
      required_checks: ${{ steps.policy.outputs.required_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic risk policy gate
        id: policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const policy = JSON.parse(fs.readFileSync(".github/risk-policy.json", "utf8"));
            const isPR = context.eventName === "pull_request";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request?.number;
            const files = [];

            if (isPR && prNumber) {
              const changed = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100
              });
              for (const file of changed) files.push(file.filename);
            }

            const highPrefixes = policy.riskTierRules?.highPrefixes || [];
            const tier = files.some((file) => highPrefixes.some((prefix) => file.startsWith(prefix))) ? "high" : "low";
            const requiredChecks = policy.mergePolicy?.[tier]?.requiredChecks || [];

            const controlPlane = policy.docsDrift?.controlPlanePrefixes || [];
            const docPrefixes = policy.docsDrift?.requiredDocPrefixes || [];
            const touchedControl = files.some((file) => controlPlane.some((prefix) => file.startsWith(prefix)));
            const touchedDocs = files.some((file) => docPrefixes.some((prefix) => file === prefix || file.startsWith(prefix)));

            if (isPR && touchedControl && !touchedDocs) {
              core.setFailed("Control-plane changes require docs updates (docs/** or README.md).");
              return;
            }

            core.setOutput("tier", tier);
            core.setOutput("required_checks", JSON.stringify(requiredChecks));

  code-review-agent:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Review diff for obvious secret leaks
        shell: bash
        run: |
          set -euo pipefail
          DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          changed_files="$(git diff --name-only "$DIFF_TARGET" || true)"
          echo "$changed_files"

          if echo "$changed_files" | grep -E '(^|/)\.env($|\.|_)' | grep -Ev '\.env\.example$' >/dev/null; then
            echo "Tracked .env-like file detected in PR diff."
            exit 1
          fi

          patch="$(git diff "$DIFF_TARGET" || true)"
          if echo "$patch" | grep -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}' >/dev/null; then
            echo "Potential credential/private-key pattern detected in diff."
            exit 1
          fi

          echo "code-review-agent checks passed."

  build:
    needs: risk-policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
